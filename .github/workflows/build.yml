name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build dylib (arm64e)
        run: bash tools/ci-build.sh

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: lvglass-deb
          path: dist/*.deb
          if-no-files-found: error
